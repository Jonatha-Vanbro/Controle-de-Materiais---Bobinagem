<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controle de Materiais - Bobinagem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .header-blue {
      background-color: #1b4079;
      color: white;
    }
    .table-custom th {
      background-color: #1b4079;
      color: white;
      text-align: center;
      vertical-align: middle;
      font-size: 0.85rem;
    }
    .table-custom td {
      vertical-align: middle;
      font-size: 0.85rem;
    }
    .card-historico {
      background-color: #f7f5ee;
      border: 1px solid #e2ded0;
    }
    .titulo-historico {
      color: #d90429;
      font-weight: bold;
    }
  </style>
</head>
<body class="bg-light">
  <div class="container-fluid py-4 px-4">
    <div class="row g-4">
      
      <!-- PAINEL ESQUERDO: Formulário + Histórico -->
      <div class="col-lg-4 col-md-5">
        
        <!-- CARD FORMULÁRIO -->
        <div class="card shadow-sm p-4 mb-4">
          <h4 class="mb-4 text-primary text-center fw-bold">Controle de Materiais - Bobinagem</h4>
          
          <form id="formMovimento">
            <div class="mb-3">
              <label class="form-label fw-bold">Tipo de Movimento</label>
              <select class="form-select" id="tipo" required>
                <option value="Entrada">Entrada</option>
                <option value="Saída">Saída</option>
              </select>
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-bold">Selecione o Material</label>
              <select class="form-select" id="selectMaterial" required>
                <option value="">Selecione um item...</option>
              </select>
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-bold">Quantidade</label>
              <input type="number" class="form-control" id="quantidade" required min="0.01" step="any" placeholder="Digite a quantidade">
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">Responsável</label>
              <input type="text" class="form-control" id="responsavel" required placeholder="Seu nome">
            </div>
            
            <button type="submit" class="w-100 btn btn-primary btn-lg fw-bold" id="btnSalvar">Registrar Operação</button>
          </form>
        </div>

        <!-- CARD HISTÓRICO DAS ÚLTIMAS 5 MOVIMENTAÇÕES -->
        <div class="card card-historico shadow-sm p-4">
          <h5 class="titulo-historico text-center mb-3">Histórico das últimas 5 movimentações</h5>
          <div id="listaHistorico" class="list-group list-group-flush rounded shadow-sm">
            <div class="list-group-item text-center text-muted py-3 small" id="historicoVazio">
              Nenhuma movimentação registrada nesta sessão.
            </div>
          </div>
        </div>

      </div>

      <!-- PAINEL DIREITO: Tabela de Estoque -->
      <div class="col-lg-8 col-md-7">
        <div class="card shadow-sm p-3">
          <div class="table-responsive">
            <table class="table table-bordered table-hover table-custom mb-0" id="tabelaEstoque">
              <thead>
                <tr>
                  <th>CÓDIGO</th>
                  <th>MATERIAL</th>
                  <th>UNIDADE</th>
                  <th>ESTOQUE INICIAL</th>
                  <th>ENTRADAS</th>
                  <th>SAÍDAS</th>
                  <th>ESTOQUE ATUAL</th>
                </tr>
              </thead>
              <tbody id="corpoTabela">
                <!-- Preenchido via JavaScript -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbzfFbUq4B8-lc_wAd1t26qsOUKuthnYZxxBRazFGExnHsB80q7fyc5UaAdrYT9r6jAP/exec";

    // Lista master de materiais
    const listaMateriais = [
      { id: 0, codigo: "100.110.000.001", material: "Fita isolante", unidade: "Unidade", inicial: 0, entradas: 0, saidas: 0 },
      { id: 1, codigo: "100.110.000.002", material: "Fita autofusão", unidade: "Unidade", inicial: 0, entradas: 0, saidas: 0 },
      { id: 2, codigo: "100.130.000.009", material: "Fita crepe", unidade: "Unidade", inicial: 0, entradas: 0, saidas: 0 },
      { id: 3, codigo: "100.060.000.025", material: "Estanho", unidade: "Unidade", inicial: 0, entradas: 0, saidas: 0 },
      { id: 4, codigo: "100.070.000.001", material: "Fio 1,5mm² - Preto", unidade: "Caixa", inicial: 0, entradas: 0, saidas: 0 },
      { id: 5, codigo: "100.070.000.001", material: "Fio 1,5mm² - Branco", unidade: "Caixa", inicial: 0, entradas: 0, saidas: 0 },
      { id: 6, codigo: "100.070.000.001", material: "Fio 1,5mm² - Vermelho", unidade: "Caixa", inicial: 0, entradas: 0, saidas: 0 },
      { id: 7, codigo: "100.070.000.002", material: "Fio 2,5mm² - Preto", unidade: "Caixa", inicial: 0, entradas: 0, saidas: 0 },
      { id: 8, codigo: "100.070.000.002", material: "Fio 2,5mm² - Branco", unidade: "Caixa", inicial: 0, entradas: 0, saidas: 0 },
      { id: 9, codigo: "100.070.000.002", material: "Fio 2,5mm² - Vermelho", unidade: "Caixa", inicial: 0, entradas: 0, saidas: 0 },
      { id: 10, codigo: "100.070.000.005", material: "Fio 4,0mm² - Preto", unidade: "Caixa", inicial: 0, entradas: 0, saidas: 0 },
      { id: 11, codigo: "100.070.000.005", material: "Fio 4,0mm² - Branco", unidade: "Caixa", inicial: 0, entradas: 0, saidas: 0 },
      { id: 12, codigo: "100.070.000.005", material: "Fio 4,0mm² - Vermelho", unidade: "Caixa", inicial: 0, entradas: 0, saidas: 0 },
      { id: 13, codigo: "100.070.000.011", material: "Fio 6,0mm² - Preto", unidade: "Caixa", inicial: 0, entradas: 0, saidas: 0 },
      { id: 14, codigo: "100.070.000.011", material: "Fio 6,0mm² - Branco", unidade: "Caixa", inicial: 0, entradas: 0, saidas: 0 },
      { id: 15, codigo: "100.070.000.011", material: "Fio 6,0mm² - Vermelho", unidade: "Caixa", inicial: 0, entradas: 0, saidas: 0 },
      { id: 16, codigo: "100.070.000.006", material: "Fio 10,0mm² - Preto", unidade: "Caixa", inicial: 0, entradas: 0, saidas: 0 },
      { id: 17, codigo: "100.070.000.006", material: "Fio 10,0mm² - Branco", unidade: "Caixa", inicial: 0, entradas: 0, saidas: 0 },
      { id: 18, codigo: "100.070.000.006", material: "Fio 10,0mm² - Vermelho", unidade: "Caixa", inicial: 0, entradas: 0, saidas: 0 },
      { id: 19, codigo: "100.070.000.014", material: "Cabo chato 3 x 2,5mm²", unidade: "Metros", inicial: 0, entradas: 0, saidas: 0 },
      { id: 20, codigo: "100.070.000.015", material: "Cabo chato 3 x 4,0mm²", unidade: "Metros", inicial: 0, entradas: 0, saidas: 0 },
      { id: 21, codigo: "100.070.000.016", material: "Cabo chato 3 x 6,0mm²", unidade: "Metros", inicial: 0, entradas: 0, saidas: 0 },
      { id: 22, codigo: "100.070.000.017", material: "Cabo chato 3 x 10,0mm²", unidade: "Metros", inicial: 0, entradas: 0, saidas: 0 }
    ];

    const historico = [];

    // Inicialização do Formulário e da Tabela
    function carregarDados() {
      const select = document.getElementById('selectMaterial');
      const corpoTabela = document.getElementById('corpoTabela');
      
      select.innerHTML = '<option value="">Selecione um item...</option>';
      corpoTabela.innerHTML = '';

      listaMateriais.forEach((item) => {
        // Popula Select
        const option = document.createElement('option');
        option.value = item.id;
        option.textContent = `${item.codigo} - ${item.material} (${item.unidade})`;
        select.appendChild(option);

        // Popula Tabela
        const estoqueAtual = item.inicial + item.entradas - item.saidas;
        const tr = document.createElement('tr');
        tr.id = `row-${item.id}`;
        tr.innerHTML = `
          <td>${item.codigo}</td>
          <td class="fw-semibold">${item.material}</td>
          <td class="text-center">${item.unidade}</td>
          <td class="text-center text-muted">${item.inicial}</td>
          <td class="text-center text-success fw-bold" id="ent-${item.id}">${item.entradas}</td>
          <td class="text-center text-danger fw-bold" id="sai-${item.id}">${item.saidas}</td>
          <td class="text-center fw-bold" id="atu-${item.id}">${estoqueAtual}</td>
        `;
        corpoTabela.appendChild(tr);
      });
    }

    // Atualiza o painel do histórico
    function atualizarHistorico(tipo, material, qtd, responsavel) {
      const hora = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      historico.unshift({ tipo, material, qtd, responsavel, hora });

      if (historico.length > 5) historico.pop();

      const listaDiv = document.getElementById('listaHistorico');
      listaDiv.innerHTML = '';

      historico.forEach((h) => {
        const badgeClass = h.tipo === 'Entrada' ? 'bg-success' : 'bg-danger';
        const itemHtml = `
          <div class="list-group-item d-flex justify-content-between align-items-center">
            <div>
              <span class="badge ${badgeClass} me-2">${h.tipo}</span>
              <strong class="small">${h.material}</strong>
              <div class="text-muted style="font-size: 0.75rem;">Qtd: <b>${h.qtd}</b> | Resp: ${h.responsavel}</div>
            </div>
            <span class="text-muted small">${h.hora}</span>
          </div>
        `;
        listaDiv.innerHTML += itemHtml;
      });
    }

    // Evento de envio do formulário
    document.getElementById('formMovimento').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const itemIndex = document.getElementById('selectMaterial').value;
      if (itemIndex === "") {
        alert('Por favor, selecione um material.');
        return;
      }

      const item = listaMateriais[itemIndex];
      const tipo = document.getElementById('tipo').value;
      const qtd = parseFloat(document.getElementById('quantidade').value);
      const responsavel = document.getElementById('responsavel').value;

      const btn = document.getElementById('btnSalvar');
      btn.disabled = true;
      btn.innerText = 'Salvando...';

      // Atualiza estado local da tabela
      if (tipo === 'Entrada') {
        item.entradas += qtd;
      } else {
        item.saidas += qtd;
      }

      const novoEstoque = item.inicial + item.entradas - item.saidas;
      document.getElementById(`ent-${item.id}`).innerText = item.entradas;
      document.getElementById(`sai-${item.id}`).innerText = item.saidas;
      document.getElementById(`atu-${item.id}`).innerText = novoEstoque;

      // Envia para o Google Sheets via Apps Script
      const dados = {
        tipo: tipo,
        codigo: item.codigo,
        material: item.material,
        quantidade: qtd,
        responsavel: responsavel
      };

      fetch(URL_APPS_SCRIPT, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dados)
      })
      .then(() => {
        atualizarHistorico(tipo, item.material, qtd, responsavel);
        alert('Movimentação registrada com sucesso!');
        document.getElementById('formMovimento').reset();
        btn.disabled = false;
        btn.innerText = 'Registrar Operação';
      })
      .catch((err) => {
        alert('Erro ao registrar via Apps Script: ' + err);
        btn.disabled = false;
        btn.innerText = 'Registrar Operação';
      });
    });

    // Carrega dados na inicialização
    carregarDados();
  </script>
</body>
</html>
