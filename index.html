<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Controle de Materiais - Bobinagem</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>

    body {
      background-color: #f8f9fa;
    }

    .header-blue {
      background-color: #1b4079;
      color: white;
    }

    .table-custom th {
      background-color: #1b4079;
      color: white;
      text-align: center;
      vertical-align: middle;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .table-custom td {
      vertical-align: middle;
      font-size: 0.85rem;
    }

    .card-historico {
      background-color: #f7f5ee;
      border: 1px solid #e2ded0;
    }

    .titulo-historico {
      color: #d90429;
      font-weight: bold;
    }

    .estoque-baixo {
      background-color: #fff3cd !important;
    }

    .estoque-negativo {
      background-color: #f8d7da !important;
      color: #842029;
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }

    .table-responsive {
      max-height: 75vh;
      overflow-y: auto;
    }

    .table-custom thead th {
      position: sticky;
      top: 0;
      z-index: 2;
    }

    /* =====================================================
       MODAL DE CONFIRMAÇÃO
       ===================================================== */

    .modal-confirmacao .modal-header {
      border-bottom: 0;
    }

    .modal-confirmacao .modal-footer {
      border-top: 0;
    }

    .icone-sucesso {
      font-size: 3rem;
      color: #198754;
    }

    .icone-erro {
      font-size: 3rem;
      color: #dc3545;
    }

    .icone-aviso {
      font-size: 3rem;
      color: #ffc107;
    }

    .dados-movimentacao {
      background-color: #f8f9fa;
      border-radius: 8px;
      padding: 15px;
      text-align: left;
    }

    .dados-movimentacao .linha-dado {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 5px 0;
      border-bottom: 1px solid #dee2e6;
    }

    .dados-movimentacao .linha-dado:last-child {
      border-bottom: none;
    }

    .dados-movimentacao .label-dado {
      font-weight: 600;
      color: #6c757d;
    }

    .dados-movimentacao .valor-dado {
      font-weight: 600;
      text-align: right;
    }

  </style>

</head>

<body>

  <div class="container-fluid py-4 px-4">

    <div class="row g-4">

      <!-- ===================================================== -->
      <!-- COLUNA ESQUERDA -->
      <!-- ===================================================== -->

      <div class="col-lg-4 col-md-5">

        <!-- CARD DE MOVIMENTAÇÃO -->

        <div class="card shadow-sm p-4 mb-4">

          <h4 class="mb-4 text-primary text-center fw-bold">
            Controle de Materiais - Bobinagem
          </h4>

          <form id="formMovimento">

            <!-- TIPO DE MOVIMENTO -->

            <div class="mb-3">

              <label class="form-label fw-bold">
                Tipo de Movimento
              </label>

              <select
                class="form-select"
                id="tipo"
                required
              >

                <option value="Entrada">
                  Entrada
                </option>

                <option value="Saída">
                  Saída
                </option>

              </select>

            </div>


            <!-- MATERIAL -->

            <div class="mb-3">

              <label class="form-label fw-bold">
                Selecione o Material
              </label>

              <select
                class="form-select"
                id="selectMaterial"
                required
              >

                <option value="">
                  Carregando materiais...
                </option>

              </select>

            </div>


            <!-- QUANTIDADE -->

            <div class="mb-3">

              <label class="form-label fw-bold">
                Quantidade
              </label>

              <input
                type="number"
                class="form-control"
                id="quantidade"
                required
                min="1"
                step="1"
                placeholder="Digite a quantidade"
              >

            </div>


            <!-- RESPONSÁVEL -->

            <div class="mb-3">

              <label class="form-label fw-bold">
                Responsável
              </label>

              <input
                type="text"
                class="form-control"
                id="responsavel"
                required
                placeholder="Seu nome"
              >

            </div>


            <!-- BOTÃO -->

            <button
              type="submit"
              class="w-100 btn btn-primary btn-lg fw-bold"
              id="btnSalvar"
            >
              Registrar Operação
            </button>

          </form>

        </div>


        <!-- ===================================================== -->
        <!-- HISTÓRICO -->
        <!-- ===================================================== -->

        <div class="card card-historico shadow-sm p-4">

          <h5 class="titulo-historico text-center mb-3">
            Últimaos Registros
          </h5>

          <div
            id="listaHistorico"
            class="list-group list-group-flush rounded shadow-sm"
          >

            <div
              class="list-group-item text-center text-muted py-3 small"
              id="historicoVazio"
            >
              Carregando histórico...
            </div>

          </div>

        </div>

      </div>


      <!-- ===================================================== -->
      <!-- COLUNA DIREITA - ESTOQUE -->
      <!-- ===================================================== -->

      <div class="col-lg-8 col-md-7">

        <div class="card shadow-sm p-3">

          <!-- CABEÇALHO DA TABELA -->

          <div class="d-flex justify-content-between align-items-center mb-3">

            <h5 class="mb-0 fw-bold">
              Estoque de Materiais
            </h5>

            <button
              type="button"
              class="btn btn-outline-primary btn-sm"
              id="btnAtualizar"
            >
              ↻ Atualizar
            </button>

          </div>


          <!-- TABELA -->

          <div class="table-responsive">

            <table
              class="table table-bordered table-hover table-custom mb-0"
              id="tabelaEstoque"
            >

              <thead>

                <tr>

                  <th>
                    CÓDIGO
                  </th>

                  <th>
                    MATERIAL
                  </th>

                  <th>
                    UNIDADE
                  </th>

                  <th>
                    ESTOQUE INICIAL
                  </th>

                  <th>
                    ENTRADAS
                  </th>

                  <th>
                    SAÍDAS
                  </th>

                  <th>
                    ESTOQUE ATUAL
                  </th>

                </tr>

              </thead>


              <tbody id="corpoTabela">

                <tr>

                  <td
                    colspan="7"
                    class="text-center text-muted py-4"
                  >
                    Carregando dados...
                  </td>

                </tr>

              </tbody>

            </table>

          </div>

        </div>

      </div>

    </div>

  </div>


  <!-- ========================================================= -->
  <!-- MODAL DE CONFIRMAÇÃO -->
  <!-- ========================================================= -->

  <div
    class="modal fade modal-confirmacao"
    id="modalConfirmacao"
    tabindex="-1"
    aria-labelledby="tituloModal"
    aria-hidden="true"
  >

    <div class="modal-dialog modal-dialog-centered">

      <div class="modal-content">

        <div class="modal-header justify-content-center">

          <h5
            class="modal-title fw-bold"
            id="tituloModal"
          >
            Movimentação registrada
          </h5>

        </div>


        <div class="modal-body text-center">

          <div
            id="iconeModal"
            class="icone-sucesso mb-3"
          >
            ✓
          </div>


          <div
            id="mensagemModal"
            class="mb-3"
          >
            Movimentação registrada com sucesso!
          </div>


          <div
            id="dadosModal"
            class="dados-movimentacao"
          >

            <div class="linha-dado">

              <span class="label-dado">
                ID
              </span>

              <span
                class="valor-dado"
                id="modalID"
              >
              </span>

            </div>


            <div class="linha-dado">

              <span class="label-dado">
                Material
              </span>

              <span
                class="valor-dado"
                id="modalMaterial"
              >
              </span>

            </div>


            <div class="linha-dado">

              <span class="label-dado">
                Tipo
              </span>

              <span
                class="valor-dado"
                id="modalTipo"
              >
              </span>

            </div>


            <div class="linha-dado">

              <span class="label-dado">
                Quantidade
              </span>

              <span
                class="valor-dado"
                id="modalQuantidade"
              >
              </span>

            </div>


            <div class="linha-dado">

              <span class="label-dado">
                Estoque atual
              </span>

              <span
                class="valor-dado"
                id="modalEstoque"
              >
              </span>

            </div>

          </div>

        </div>


        <div class="modal-footer justify-content-center">

          <button
            type="button"
            class="btn btn-primary px-5 fw-bold"
            data-bs-dismiss="modal"
          >
            OK
          </button>

        </div>

      </div>

    </div>

  </div>


  <!-- ========================================================= -->
  <!-- BOOTSTRAP JAVASCRIPT -->
  <!-- ========================================================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
  ></script>


  <!-- ========================================================= -->
  <!-- JAVASCRIPT DO SISTEMA -->
  <!-- ========================================================= -->

  <script>

    /*
     * =========================================================
     * URL DO GOOGLE APPS SCRIPT
     * =========================================================
     */

    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbwDohgFXPrmtm9mTc7BKOUrjOPNRlqGOQgEsHyfycxZ_pO530O1WkunVXHQz9zBt1Iu/exec";


    /*
     * =========================================================
     * VARIÁVEIS
     * =========================================================
     */

    let listaMateriais = [];

    let historico = [];


    /*
     * =========================================================
     * FUNÇÃO PARA ESCAPAR HTML
     * =========================================================
     */

    function escaparHTML(texto) {

      if (
        texto === null ||
        texto === undefined
      ) {

        return "";

      }

      return String(texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*
     * =========================================================
     * ABRIR MODAL DE SUCESSO
     * =========================================================
     */

    function mostrarSucesso(resultado) {

      const modalElement =
        document.getElementById(
          "modalConfirmacao"
        );


      const titulo =
        document.getElementById(
          "tituloModal"
        );


      const icone =
        document.getElementById(
          "iconeModal"
        );


      const mensagem =
        document.getElementById(
          "mensagemModal"
        );


      const dadosModal =
        document.getElementById(
          "dadosModal"
        );


      /*
       * Configura aparência de sucesso.
       */

      titulo.innerText =
        "Movimentação registrada";


      titulo.className =
        "modal-title fw-bold text-success";


      icone.className =
        "icone-sucesso mb-3";


      icone.innerText =
        "✓";


      mensagem.innerText =
        "Movimentação registrada com sucesso!";


      mensagem.className =
        "mb-3";


      /*
       * Preenche os dados.
       */

      document.getElementById(
        "modalID"
      ).innerText =
        resultado.id || "-";


      document.getElementById(
        "modalMaterial"
      ).innerText =
        resultado.material || "-";


      document.getElementById(
        "modalTipo"
      ).innerText =
        resultado.tipo || "-";


      document.getElementById(
        "modalQuantidade"
      ).innerText =
        formatarNumero(
          resultado.quantidade
        ) +
        " " +
        (
          resultado.unidade ||
          ""
        );


      document.getElementById(
        "modalEstoque"
      ).innerText =
        formatarNumero(
          resultado.estoqueAtual
        ) +
        " " +
        (
          resultado.unidade ||
          ""
        );


      dadosModal.style.display =
        "block";


      const modal =
        bootstrap.Modal.getOrCreateInstance(
          modalElement
        );


      modal.show();

    }


    /*
     * =========================================================
     * ABRIR MODAL DE ERRO / AVISO
     * =========================================================
     */

    function mostrarAviso(
      mensagem,
      tipo = "danger"
    ) {

      const modalElement =
        document.getElementById(
          "modalConfirmacao"
        );


      const titulo =
        document.getElementById(
          "tituloModal"
        );


      const icone =
        document.getElementById(
          "iconeModal"
        );


      const mensagemElemento =
        document.getElementById(
          "mensagemModal"
        );


      const dadosModal =
        document.getElementById(
          "dadosModal"
        );


      /*
       * Esconde os dados da movimentação
       * quando for uma mensagem de erro/aviso.
       */

      dadosModal.style.display =
        "none";


      if (tipo === "warning") {

        titulo.innerText =
          "Atenção";

        titulo.className =
          "modal-title fw-bold text-warning";

        icone.className =
          "icone-aviso mb-3";

        icone.innerText =
          "⚠";

      } else {

        titulo.innerText =
          "Não foi possível realizar a operação";

        titulo.className =
          "modal-title fw-bold text-danger";

        icone.className =
          "icone-erro mb-3";

        icone.innerText =
          "✕";

      }


      mensagemElemento.innerText =
        mensagem;


      mensagemElemento.className =
        "mb-3";


      const modal =
        bootstrap.Modal.getOrCreateInstance(
          modalElement
        );


      modal.show();

    }


    /*
     * =========================================================
     * CARREGAR DADOS DO APPS SCRIPT
     *
     * Utilizamos JSONP para leitura dos dados.
     * =========================================================
     */

    function carregarDados() {

      return new Promise((resolve, reject) => {

        const callbackName =
          "callbackEstoque_" +
          Date.now();


        const script =
          document.createElement(
            "script"
          );


        const timeout =
          setTimeout(() => {

            limpar();

            reject(
              new Error(
                "Tempo limite excedido ao consultar o Google Apps Script."
              )
            );

          }, 15000);


        function limpar() {

          clearTimeout(timeout);


          if (script.parentNode) {

            script.parentNode.removeChild(
              script
            );

          }


          delete window[callbackName];

        }


        window[callbackName] =
          function(resposta) {

            limpar();


            if (!resposta) {

              reject(
                new Error(
                  "Resposta vazia do Google Apps Script."
                )
              );

              return;

            }


            if (
              resposta.sucesso === false
            ) {

              reject(
                new Error(
                  resposta.erro ||
                  "Erro desconhecido no servidor."
                )
              );

              return;

            }


            resolve(
              resposta
            );

          };


        script.onerror =
          function() {

            limpar();


            reject(
              new Error(
                "Não foi possível conectar ao Google Apps Script."
              )
            );

          };


        script.src =
          URL_APPS_SCRIPT +
          "?acao=dados&callback=" +
          encodeURIComponent(
            callbackName
          );


        document.body.appendChild(
          script
        );

      });

    }


    /*
     * =========================================================
     * PREENCHER SELECT DE MATERIAIS
     * =========================================================
     */

    function preencherMateriais() {

      const select =
        document.getElementById(
          "selectMaterial"
        );


      select.innerHTML =
        '<option value="">Selecione um item...</option>';


      listaMateriais.forEach(
        (item) => {

          const option =
            document.createElement(
              "option"
            );


          /*
           * A linha da planilha é utilizada
           * como identificador.
           */

          option.value =
            item.linha;


          option.textContent =
            `${item.codigo} - ${item.material} (${item.unidade})`;


          select.appendChild(
            option
          );

        }
      );

    }


    /*
     * =========================================================
     * PREENCHER TABELA DE ESTOQUE
     * =========================================================
     */

    function preencherTabela() {

      const corpoTabela =
        document.getElementById(
          "corpoTabela"
        );


      corpoTabela.innerHTML =
        "";


      if (
        !listaMateriais.length
      ) {

        corpoTabela.innerHTML = `

          <tr>

            <td
              colspan="7"
              class="text-center text-muted py-4"
            >
              Nenhum material encontrado.
            </td>

          </tr>

        `;

        return;

      }


      listaMateriais.forEach(
        (item) => {

          const estoqueAtual =
            Number(
              item.estoqueAtual
            ) || 0;


          const tr =
            document.createElement(
              "tr"
            );


          /*
           * Destaca estoques negativos.
           */

          if (
            estoqueAtual < 0
          ) {

            tr.classList.add(
              "estoque-negativo"
            );

          }


          tr.innerHTML = `

            <td class="text-center">
              ${escaparHTML(item.codigo)}
            </td>

            <td class="fw-semibold">
              ${escaparHTML(item.material)}
            </td>

            <td class="text-center">
              ${escaparHTML(item.unidade)}
            </td>

            <td class="text-center text-muted">
              ${formatarNumero(item.inicial)}
            </td>

            <td class="text-center text-success fw-bold">
              ${formatarNumero(item.entradas)}
            </td>

            <td class="text-center text-danger fw-bold">
              ${formatarNumero(item.saidas)}
            </td>

            <td class="text-center fw-bold fs-6">
              ${formatarNumero(estoqueAtual)}
            </td>

          `;


          corpoTabela.appendChild(
            tr
          );

        }
      );

    }


    /*
     * =========================================================
     * FORMATAR NÚMEROS
     * =========================================================
     */

    function formatarNumero(valor) {

      const numero =
        Number(valor) || 0;


      if (
        Number.isInteger(numero)
      ) {

        return numero.toLocaleString(
          "pt-BR"
        );

      }


      return numero.toLocaleString(
        "pt-BR",
        {
          minimumFractionDigits: 0,
          maximumFractionDigits: 2
        }
      );

    }


    /*
     * =========================================================
     * PREENCHER HISTÓRICO
     * =========================================================
     */

    function preencherHistorico() {

      const listaDiv =
        document.getElementById(
          "listaHistorico"
        );


      listaDiv.innerHTML =
        "";


      if (
        !historico.length
      ) {

        listaDiv.innerHTML = `

          <div
            class="list-group-item text-center text-muted py-3 small"
          >
            Nenhuma movimentação registrada.
          </div>

        `;

        return;

      }


      historico.forEach(
        (h) => {

          const badgeClass =
            h.tipo === "Entrada"
              ? "bg-success"
              : "bg-danger";


          const dataHora =
            formatarDataHora(
              h.dataHora
            );


          const itemHtml = `

            <div
              class="list-group-item"
            >

              <div
                class="d-flex justify-content-between align-items-start"
              >

                <div>

                  <span
                    class="badge ${badgeClass} me-2"
                  >
                    ${escaparHTML(h.tipo)}
                  </span>

                  <strong class="small">
                    ${escaparHTML(h.material)}
                  </strong>

                </div>

                <span
                  class="text-muted small"
                >
                  ${dataHora}
                </span>

              </div>


              <div
                class="text-muted"
                style="font-size: 0.75rem;"
              >

                Qtd:
                <b>
                  ${formatarNumero(h.quantidade)}
                </b>

                &nbsp;|&nbsp;

                Resp:
                ${escaparHTML(h.responsavel)}

              </div>

            </div>

          `;


          listaDiv.innerHTML +=
            itemHtml;

        }
      );

    }


    /*
     * =========================================================
     * FORMATAR DATA/HORA
     * =========================================================
     */

    function formatarDataHora(
      dataHora
    ) {

      if (!dataHora) {

        return "";

      }


      const data =
        new Date(
          dataHora
        );


      if (
        isNaN(
          data.getTime()
        )
      ) {

        return dataHora;

      }


      return data.toLocaleString(
        "pt-BR",
        {
          day: "2-digit",
          month: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }


    /*
     * =========================================================
     * ATUALIZAR TODA A INTERFACE
     * =========================================================
     */

    async function atualizarTela() {

      try {

        const resposta =
          await carregarDados();


        listaMateriais =
          resposta.materiais || [];


        historico =
          resposta.movimentacoes || [];


        preencherMateriais();

        preencherTabela();

        preencherHistorico();


      } catch (erro) {

        console.error(
          "Erro ao carregar dados:",
          erro
        );


        const corpoTabela =
          document.getElementById(
            "corpoTabela"
          );


        corpoTabela.innerHTML = `

          <tr>

            <td
              colspan="7"
              class="text-center text-danger py-4"
            >

              Erro ao carregar os dados.

              <br>

              <small>
                ${escaparHTML(
                  erro.message
                )}
              </small>

            </td>

          </tr>

        `;


        mostrarAviso(
          "Não foi possível carregar os dados da planilha: " +
          erro.message,
          "danger"
        );

      }

    }


    /*
     * =========================================================
     * REGISTRAR MOVIMENTAÇÃO
     * =========================================================
     */

    async function registrarMovimentacao(
      dados
    ) {

      const resposta =
        await fetch(
          URL_APPS_SCRIPT,
          {
            method: "POST",

            redirect: "follow",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:
              JSON.stringify(
                dados
              )
          }
        );


      if (!resposta.ok) {

        throw new Error(
          "Erro HTTP " +
          resposta.status
        );

      }


      const resultado =
        await resposta.json();


      return resultado;

    }


    /*
     * =========================================================
     * SUBMIT DO FORMULÁRIO
     * =========================================================
     */

    document
      .getElementById(
        "formMovimento"
      )
      .addEventListener(
        "submit",
        async function(e) {

          e.preventDefault();


          /*
           * MATERIAL
           */

          const linha =
            document
              .getElementById(
                "selectMaterial"
              )
              .value;


          if (!linha) {

            mostrarAviso(
              "Por favor, selecione um material.",
              "warning"
            );

            return;

          }


          /*
           * TIPO
           */

          const tipo =
            document
              .getElementById(
                "tipo"
              )
              .value;


          /*
           * QUANTIDADE
           */

          const quantidade =
            Number(
              document
                .getElementById(
                  "quantidade"
                )
                .value
            );


          if (
            !quantidade ||
            quantidade <= 0
          ) {

            mostrarAviso(
              "Informe uma quantidade válida.",
              "warning"
            );

            return;

          }


          /*
           * RESPONSÁVEL
           */

          const responsavel =
            document
              .getElementById(
                "responsavel"
              )
              .value
              .trim();


          if (!responsavel) {

            mostrarAviso(
              "Informe o responsável pela movimentação.",
              "warning"
            );

            return;

          }


          /*
           * LOCALIZA O MATERIAL
           */

          const item =
            listaMateriais.find(
              material =>
                String(
                  material.linha
                ) ===
                String(
                  linha
                )
            );


          if (!item) {

            mostrarAviso(
              "Material não encontrado.",
              "danger"
            );

            return;

          }


          /*
           * BOTÃO
           */

          const btn =
            document.getElementById(
              "btnSalvar"
            );


          btn.disabled =
            true;


          btn.innerText =
            "Salvando...";


          try {

            /*
             * DADOS DA MOVIMENTAÇÃO
             *
             * OBSERVAÇÃO FOI REMOVIDA.
             */

            const dados = {

              tipo:
                tipo,

              linha:
                Number(linha),

              codigo:
                item.codigo,

              material:
                item.material,

              quantidade:
                quantidade,

              responsavel:
                responsavel

            };


            /*
             * ENVIA AO GOOGLE APPS SCRIPT
             */

            const resultado =
              await registrarMovimentacao(
                dados
              );


            /*
             * VERIFICA RESPOSTA
             */

            if (
              !resultado ||
              resultado.sucesso !== true
            ) {

              throw new Error(
                resultado?.erro ||
                "O servidor não confirmou a movimentação."
              );

            }


            /*
             * LIMPA QUANTIDADE
             */

            document
              .getElementById(
                "quantidade"
              )
              .value =
              "";


            /*
             * ATUALIZA DADOS DA PLANILHA
             */

            await atualizarTela();


            /*
             * MOSTRA POP-UP DE SUCESSO
             */

            mostrarSucesso(
              resultado
            );


          } catch (erro) {

            console.error(
              "Erro ao registrar:",
              erro
            );


            mostrarAviso(
              "Erro ao registrar movimentação: " +
              erro.message,
              "danger"
            );


          } finally {

            btn.disabled =
              false;


            btn.innerText =
              "Registrar Operação";

          }

        }
      );


    /*
     * =========================================================
     * BOTÃO ATUALIZAR
     * =========================================================
     */

    document
      .getElementById(
        "btnAtualizar"
      )
      .addEventListener(
        "click",
        async function() {

          const btn =
            this;


          btn.disabled =
            true;


          btn.innerText =
            "Atualizando...";


          try {

            await atualizarTela();


          } finally {

            btn.disabled =
              false;


            btn.innerText =
              "↻ Atualizar";

          }

        }
      );


    /*
     * =========================================================
     * INICIALIZAÇÃO
     * =========================================================
     */

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        atualizarTela();

      }
    );

  </script>

</body>

</html>
