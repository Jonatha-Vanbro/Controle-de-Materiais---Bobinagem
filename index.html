<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controle de Materiais - Bobinagem</title>
  <link rel="icon" type="image/png" href="favicon3.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* =====================================================
       CONFIGURAÇÕES GERAIS
       ===================================================== */
    :root {
      --azul-principal: #1b4079;
      --azul-hover: #153461;
      --azul-claro: #eaf1f9;
      --fundo: #eef1f4;
      --branco: #ffffff;
      --texto: #263238;
      --texto-secundario: #6c757d;
      --borda: #e0e4e8;
      --verde: #198754;
      --vermelho: #dc3545;
      --amarelo: #ffc107;
      --sombra-card: 0 2px 6px rgba(0, 0, 0, 0.05), 0 8px 24px rgba(0, 0, 0, 0.06);
      --sombra-card-hover: 0 4px 10px rgba(0, 0, 0, 0.07), 0 12px 30px rgba(0, 0, 0, 0.08);
      --raio: 12px;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--fundo);
      color: var(--texto);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
    }

    .container-fluid { max-width: 1700px; }

    /* =====================================================
       CABEÇALHO
       ===================================================== */
    .top-header {
      background: linear-gradient(135deg, #1b4079 0%, #245596 100%);
      color: white;
      border-radius: var(--raio);
      padding: 20px 24px;
      margin-bottom: 14px;
      box-shadow: 0 4px 10px rgba(27, 64, 121, 0.15), 0 10px 28px rgba(27, 64, 121, 0.10);
    }
    .top-header h1 { font-size: 1.55rem; font-weight: 700; margin: 0; }
    .top-header p { margin: 4px 0 0; opacity: 0.82; font-size: 0.9rem; }
    .header-icon {
      width: 46px; height: 46px;
      display: flex; align-items: center; justify-content: center;
      background-color: rgba(255, 255, 255, 0.14);
      border-radius: 10px; font-size: 1.4rem; margin-right: 14px;
    }

    /* =====================================================
       NAVEGAÇÃO
       ===================================================== */
    .menu-navegacao {
      background-color: white; border-radius: 10px; padding: 6px; margin-bottom: 24px;
      box-shadow: var(--sombra-card); border: 1px solid rgba(0, 0, 0, 0.035);
    }
    .menu-btn {
      border: none; background: transparent; color: #6c757d;
      font-size: 0.84rem; font-weight: 600; border-radius: 7px; padding: 9px 18px;
      transition: all 0.2s ease;
    }
    .menu-btn:hover { background-color: var(--azul-claro); color: var(--azul-principal); }
    .menu-btn.active {
      background: linear-gradient(135deg, #1b4079, #245596);
      color: white; box-shadow: 0 2px 6px rgba(27, 64, 121, 0.20);
    }

    /* =====================================================
       TELAS
       ===================================================== */
    .tela { display: none; }
    .tela.ativa { display: block; }

    /* =====================================================
       LAYOUT DA TELA DE ESTOQUE
       ===================================================== */
    #telaEstoque .row { align-items: stretch; }

    .coluna-estoque-esquerda { display: flex; flex-direction: column; }

    .card-nova-movimentacao { margin-bottom: 16px !important; }

    /* Card "Últimos Registros": altura definida pelo próprio conteúdo,
       não estica mais para preencher o espaço vertical disponível. */
    .card-ultimos-registros {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
    }

    .coluna-estoque-direita { display: flex; }

    .card-estoque-materiais {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .card-estoque-materiais .table-container {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .card-estoque-materiais .table-responsive {
      flex: 1;
      min-height: 0;
      max-height: none;
      overflow-y: auto;
    }

    /* Lista de últimos registros: mostra alguns itens e rola
       internamente caso o conteúdo ultrapasse a altura definida. */
    #listaHistorico {
      max-height: 340px;
      overflow-y: auto;
    }

    /* =====================================================
       CARDS
       ===================================================== */
    .card-custom {
      background-color: var(--branco);
      border: 1px solid rgba(0, 0, 0, 0.035);
      border-radius: var(--raio);
      box-shadow: var(--sombra-card);
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }
    .card-custom:hover { box-shadow: var(--sombra-card-hover); }
    .card-title-custom {
      font-size: 1rem; font-weight: 700; color: var(--texto);
      display: flex; align-items: center; gap: 9px;
    }
    .card-title-icon {
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      background-color: var(--azul-claro); color: var(--azul-principal);
      border-radius: 9px; font-size: 0.95rem;
    }

    /* =====================================================
       FORMULÁRIO
       ===================================================== */
    .form-label { color: #4b5563; font-size: 0.82rem; margin-bottom: 6px; }
    .form-control, .form-select {
      min-height: 44px; border: 1px solid #d9dee3; border-radius: 8px; font-size: 0.9rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .form-control:focus, .form-select:focus {
      border-color: var(--azul-principal);
      box-shadow: 0 0 0 3px rgba(27, 64, 121, 0.10);
    }
    .form-control::placeholder { color: #adb5bd; }

    /* =====================================================
       BOTÃO PRINCIPAL
       ===================================================== */
    .btn-registrar {
      min-height: 48px; border: none; border-radius: 8px;
      background: linear-gradient(135deg,
